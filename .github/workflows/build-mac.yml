name: Build macOS .dmg

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for the .dmg filename'
        required: false
        default: '2.2.0'

# The release-attach step needs write access to create/update GitHub Releases.
permissions:
  contents: write

jobs:
  build:
    # macos-14 = Apple Silicon (arm64), free for public repos.
    # Switch to macos-13 if you need an Intel build instead.
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build with Homebrew Python, NOT actions/setup-python: the latter's macOS
      # build ships a sqlite3 module without loadable-extension support, and
      # ContextVolt loads the sqlite-vec extension at runtime. Homebrew's Python
      # enables loadable extensions and links a SQLite that allows them.
      - name: Set up Homebrew Python (loadable SQLite extensions)
        id: py
        run: |
          brew install python@3.12 create-dmg
          PYBIN="$(brew --prefix python@3.12)/bin/python3.12"
          "$PYBIN" --version
          "$PYBIN" -c "import sqlite3; sqlite3.connect(':memory:').enable_load_extension(True); print('sqlite loadable extensions: OK')"
          echo "PYTHON_BIN=$PYBIN" >> "$GITHUB_OUTPUT"

      - name: Determine version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version || '2.2.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .app and .dmg
        env:
          CONTEXTVOLT_VERSION: ${{ steps.ver.outputs.value }}
          PYTHON_BIN: ${{ steps.py.outputs.PYTHON_BIN }}
        run: bash installer/build_mac.sh

      # Launch the FROZEN bundle headlessly. This is the real test that py2app
      # packaged every runtime dependency — a clean build can still ship a
      # bundle that crashes on a missing dynamic import at launch.
      - name: Smoke-test the bundled .app
        env:
          CONTEXTVOLT_CI: "1"
        run: |
          APP="dist/ContextVolt.app/Contents/MacOS/ContextVolt"
          if [ ! -x "$APP" ]; then
            echo "Bundle executable not found at $APP"; ls -la dist/ContextVolt.app/Contents/MacOS; exit 1
          fi
          # macOS ships no timeout(1) (it's GNU coreutils). Enforce a 120s ceiling
          # portably via perl: alarm() survives exec and SIGALRM's default action
          # terminates the process, so a hung bundle fails the job instead of
          # stalling the runner. (The smoke now boots the server + serves a
          # request, which can wait on a missing-Ollama startup retry first.)
          OUT=$(CONTEXTVOLT_CI=1 perl -e 'alarm shift; exec @ARGV' 120 "$APP" 2>&1) || {
            echo "Bundle launch failed:"; echo "$OUT"; exit 1
          }
          echo "$OUT"
          # Require BOTH markers: the server must have actually served a request
          # (proves the async/anyio runtime path), not just imported cleanly.
          echo "$OUT" | grep -q "server served /api/health 200 OK" \
            || { echo "Bundle started but did not serve a request — runtime broken"; exit 1; }
          echo "$OUT" | grep -q "bundled runtime import + db init OK" \
            || { echo "Expected CI marker not found"; exit 1; }

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ContextVolt-${{ steps.ver.outputs.value }}-macOS
          path: ContextVolt-*-macOS.dmg
          if-no-files-found: error

      - name: Attach to GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ContextVolt-*-macOS.dmg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
