name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        shell: powershell

      - name: Build installer bundle
        run: powershell -ExecutionPolicy Bypass -File installer\build.ps1
        shell: cmd

      - name: Compile Inno Setup installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss
        shell: powershell

      # ── Versioned release on v* tags ────────────────────────────
      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ContextVolt ${{ github.ref_name }}
          body: |
            ## ContextVolt ${{ github.ref_name }}

            ### Install
            Download and run **ContextVolt-Setup.exe**.

            On first launch ContextVolt will download Ollama and the AI model automatically.
          files: installer/output/ContextVolt-Setup.exe
          draft: false
          prerelease: false

      # ── Rolling "latest" pre-release on every master push ───────
      - name: Update latest pre-release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (master)
          body: |
            Automated build from the latest commit on `master`.

            **Commit:** ${{ github.sha }}
            **Built:** ${{ github.event.head_commit.timestamp }}

            This is a pre-release. For stable releases use a versioned tag.
          files: installer/output/ContextVolt-Setup.exe
          draft: false
          prerelease: true
