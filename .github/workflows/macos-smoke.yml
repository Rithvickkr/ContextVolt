name: macOS smoke test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# macos-latest runners are arm64 (Apple Silicon) since 2024.
# This workflow does NOT verify the pywebview GUI — there's no display in CI.
# It verifies that install.sh / start.sh succeed up through backend import + boot,
# which catches the most common breakage classes (missing wheels, pip resolver
# failures, shell-profile bugs, import errors).
jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Use the runner's Homebrew Python instead of actions/setup-python.
      # actions/setup-python's macOS builds historically ship without
      # --enable-loadable-sqlite-extensions, which breaks sqlite-vec at import.
      # Homebrew Python (which our install.sh recommends to real users) has
      # loadable sqlite extensions enabled, so this matches real-world setup.
      - name: Verify Homebrew Python
        run: |
          which python3
          python3 --version
          python3 -c "import sqlite3; sqlite3.connect(':memory:').enable_load_extension(True); print('loadable extensions OK')"

      - name: Run start.sh in headless mode
        env:
          CONTEXTVOLT_CI: "1"
        run: bash start.sh

      - name: Boot uvicorn and hit /api/health
        env:
          CONTEXTVOLT_CI: "1"
        run: |
          ./venv/bin/python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          UVICORN_PID=$!
          # wait for socket
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null; then
              echo "  /api/health responded on attempt $i"
              break
            fi
            sleep 1
          done
          curl -sSf http://127.0.0.1:8000/api/health
          kill $UVICORN_PID || true

  # Lint the Homebrew cask so syntax/style errors are caught before they reach
  # the tap. Does not install anything — just validates the .rb.
  cask-lint:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Hard gate: the cask must be valid Ruby that parses.
      - name: Ruby syntax check
        run: ruby -c installer/homebrew/contextvolt.rb

      # Advisory: brew style is strict opinionated formatting. The cask installs
      # fine regardless, and full compliance is only required to submit to the
      # official homebrew-cask repo — not for a personal tap. Surfaced in logs
      # but does not fail CI.
      - name: brew style (cask cops, advisory)
        continue-on-error: true
        run: brew style installer/homebrew/contextvolt.rb
