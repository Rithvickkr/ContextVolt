<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ContextVolt — Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0f;
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
      width: 300px;
    }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p.hint { font-size: 12px; color: #9ca3af; margin: 0 0 16px; line-height: 1.4; }
    label { display: block; font-size: 12px; margin-bottom: 6px; color: #c4b5fd; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #2d2d3a;
      background: #15151f;
      color: #e5e7eb;
      font-size: 13px;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      background: #4f46e5;
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    #status { margin-top: 10px; font-size: 12px; min-height: 16px; }
    .ok { color: #22c55e; }
    .err { color: #ef4444; }
  </style>
</head>
<body>
  <h1>ContextVolt Backend</h1>
  <p class="hint">
    The extension auto-detects the port (the app uses the first free one in
    8000–8009). Leave this blank for auto-detect; set a value only to pin a
    specific port.
  </p>
  <label for="port">Backend port (optional)</label>
  <input id="port" type="number" min="1" max="65535" placeholder="auto-detect" />
  <button id="save">Save &amp; test connection</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
